[versions]
# gradle plugins
shadow = "9.6.1"
loom = "1.18-SNAPSHOT"

# test
junit = "6.1.3"

# common
jspecify = "1.0.1"
annotations = "26.1.0"

# core
netty = "4.2.18.Final"
guava = "33.7.1-jre"
gson = "2.14.0"
snakeyaml = "2.7"
joml = "1.10.9"
lz4 = "1.11.2"

# bukkit
spigot = "1.16.1-R0.1-SNAPSHOT"
paper = "1.20.1-R0.1-SNAPSHOT"
folia = "1.20.1-R0.1-SNAPSHOT"
bstats = "3.2.1"
protocollib = "5.3.0"

# fabric
minecraft = "26.3"
fabric_loader = "0.19.5"
fabric_api = "0.160.5+26.3"
fabric_permission = "0.7.0"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }

[libraries]

# test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher" }

# common
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

# core
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
joml = { module = "org.joml:joml", version.ref = "joml" }
lz4 = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }

# bukkit
spigot = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
folia = { module = "dev.folia:folia-api", version.ref = "folia" }
bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
protocollib = { module = "net.dmulloy2:ProtocolLib", version.ref = "protocollib" }

# fabric
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }
fabric-permission = { module = "me.lucko:fabric-permissions-api", version.ref = "fabric_permission" }
